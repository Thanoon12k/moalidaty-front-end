name: moalidatna
description: "نظام إدارة مولدات الكهرباء"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  get: ^4.7.2

  # Network
  dio: ^5.9.0

  # Secure storage for JWT tokens
  flutter_secure_storage: ^9.2.4

  # Receipt image: capture widget as PNG
  screenshot: ^3.0.0

  # Share the receipt PNG
  share_plus: ^10.1.4

  # File system path
  path_provider: ^2.1.5

  # Print support
  printing: ^5.14.2
  pdf: ^3.11.3

  # Date formatting
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.69.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # QR Code scanner (camera)
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
